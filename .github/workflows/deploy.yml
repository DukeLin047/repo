name: Deploy Functions to Firebase

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝 functions 套件
        working-directory: functions
        run: npm install

      - name: 安裝 Firebase CLI
        run: npm install -g firebase-tools

      - name: 寫入機密設定 (.env)
        working-directory: functions
        run: |
          echo "LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}" >> .env
          echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env

      - name: 部署到 Firebase
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          firebase deploy --only functions,firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive
