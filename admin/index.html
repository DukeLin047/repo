function AdjustedList(props) {
  var data = props.data;
  var locations = props.locations || {};
  var onApply = props.onApply;
  var busyState = useState(null);
  var busy = busyState[0], setBusy = busyState[1];

  // 彙整所有儲位的調整紀錄；預設儲位以 items 為準（避免與 locations 重複列出）
  var adjusted = [];
  (data || []).forEach(function (it) {
    if (it.adjustment && it.adjustment !== 0) {
      adjusted.push({ loc: DEFAULT_LOCATION, item: it });
    }
  });
  Object.keys(locations).forEach(function (code) {
    if (code === DEFAULT_LOCATION) return;
    (locations[code] || []).forEach(function (it) {
      if (it.adjustment && it.adjustment !== 0) {
        adjusted.push({ loc: code, item: it });
      }
    });
  });

  function locLabel(code) {
    for (var i = 0; i < TARGET_LOCATIONS.length; i++) {
      if (TARGET_LOCATIONS[i].code === code) return code + " " + TARGET_LOCATIONS[i].label;
    }
    return code;
  }

  function clearAdjust(model, code) {
    var key = code + "|" + model;
    setBusy(key);
    onApply(model, 0, "set", code).then(function () {
      setBusy(null);
    }).catch(function () {
      setBusy(null);
    });
  }

  return h("div", { style: { background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 1px 6px rgba(0,0,0,0.07)" } },
    h("div", { style: { fontWeight: 700, fontSize: 14, color: "#333", marginBottom: 4 } }, "📝 已手動調整的型號"),
    h("div", { style: { fontSize: 11, color: "#888", marginBottom: 14 } }, "顯示各儲位「原始庫存 + 調整量 = 最終庫存」，可隨時清除調整"),
    adjusted.length === 0
      ? h("div", { style: { textAlign: "center", padding: "20px", color: "#AAAAAA", fontSize: 13 } }, "目前沒有任何手動調整")
      : h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
          adjusted.map(function (rec) {
            var it = rec.item;
            var base = it.baseStock !== undefined ? it.baseStock : it.stock;
            var adj = it.adjustment || 0;
            var key = rec.loc + "|" + it.model;
            return h("div", {
              key: key,
              style: { padding: "12px 14px", background: "#F8F9FF", borderRadius: 10, border: "1px solid #E8EAF6" }
            },
              h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 } },
                h("span", { style: { fontSize: 13, fontWeight: 700, color: "#1A237E" } }, it.model),
                h("button", {
                  onClick: function () { clearAdjust(it.model, rec.loc); },
                  disabled: busy === key,
                  style: {
                    fontSize: 11, color: "#C62828", border: "1px solid #FFCDD2", background: "#fff",
                    borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontFamily: "inherit", flexShrink: 0, marginLeft: 8
                  }
                }, busy === key ? "清除中…" : "清除調整")
              ),
              h("div", { style: { fontSize: 11, color: "#3949AB", marginBottom: 6 } }, "儲位：" + locLabel(rec.loc)),
              h("div", { style: { fontSize: 13, color: "#555", fontFamily: "monospace" } },
                "原始 " + base + "  " + (adj > 0 ? "+ " + adj : "- " + Math.abs(adj)) + "  =  ",
                h("span", { style: { fontWeight: 800, color: "#2E7D32" } }, it.stock)
              )
            );
          })
        )
  );
}

// 經銷商登入身分判斷：回傳 {role, code} 或 null
function resolveDealerIdentity(account) {
  var acc = String(account).trim().toUpperCase();
  // 區域主管：A42 或 A42B~E
  if (acc === "A42") return { role: "hq", code: "A42", label: "台中分公司二課" };
  if (DEALER_AREAS[acc]) return { role: "area", code: acc, label: acc + " 區（業務:" + DEALER_AREAS[acc].sales + "）" };
  // 經銷商：完整代號比對（大小寫不敏感）
  for (var i = 0; i < DEALER_LIST.length; i++) {
    if (DEALER_LIST[i].code.toUpperCase() === acc) {
      return { role: "dealer", code: DEALER_LIST[i].code, label: DEALER_LIST[i].code + " " + DEALER_LIST[i].name, area: DEALER_LIST[i].area };
    }
  }
  return null;
}

// 經銷商填庫存介面
function DealerStockForm(props) {
  var identity = props.identity;  // {role:'dealer', code, label, area}
  var stockState = useState(null);  // {model: qty}
  var stock = stockState[0], setStock = stockState[1];
  var customState = useState({});  // {category: [自訂型號]}
  var custom = customState[0], setCustom = customState[1];
  var loadingState = useState(true);
  var loading = loadingState[0], setLoading = loadingState[1];
  var savingState = useState(false);
  var saving = savingState[0], setSaving = savingState[1];
  var msgState = useState("");
  var msg = msgState[0], setMsg = msgState[1];
  var openCatState = useState(null);
  var openCat = openCatState[0], setOpenCat = openCatState[1];

  useEffect(function () {
    DEALER_STOCK_COL.doc(identity.code).get().then(function (doc) {
      var data = doc.exists ? doc.data() : {};
      setStock(data.stock || {});
      setCustom(data.customModels || {});
      setLoading(false);
    }).catch(function () {
      setStock({});
      setCustom({});
      setLoading(false);
    });
  }, [identity.code]);

  function setQty(model, val) {
    var n = val === "" ? "" : Math.max(0, parseInt(val, 10) || 0);
    var next = Object.assign({}, stock);
    next[model] = n;
    setStock(next);
  }

  function addCustomModel(cat) {
    var model = prompt("輸入要新增的「" + cat + "」型號");
    if (!model) return;
    model = model.trim();
    if (!model) return;
    // 檢查是否已存在（內建或自訂）
    var builtin = DEALER_PRODUCTS[cat] || [];
    var existing = builtin.concat(custom[cat] || []);
    if (existing.indexOf(model) !== -1) { alert("此型號已存在"); return; }
    var next = Object.assign({}, custom);
    next[cat] = (next[cat] || []).concat([model]);
    setCustom(next);
  }

  function delCustomModel(cat, model) {
    var next = Object.assign({}, custom);
    next[cat] = (next[cat] || []).filter(function (m) { return m !== model; });
    setCustom(next);
    // 同時清掉該型號的庫存值
    var s = Object.assign({}, stock);
    delete s[model];
    setStock(s);
  }

  function saveAll() {
    setSaving(true);
    setMsg("");
    var clean = {};
    Object.keys(stock).forEach(function (k) {
      clean[k] = stock[k] === "" ? 0 : stock[k];
    });
    var now = new Date().toLocaleString("zh-TW", { hour12: false });
    DEALER_STOCK_COL.doc(identity.code).set({
      code: identity.code, area: identity.area || "", stock: clean, customModels: custom, updatedAt: now
    }).then(function () {
      setSaving(false);
      setMsg("✅ 已儲存店面庫存（" + now + "）");
    }).catch(function () {
      setSaving(false);
      setMsg("❌ 儲存失敗，請稍後再試");
    });
  }

  if (loading) return h("div", { style: { textAlign: "center", padding: "40px", color: "#AAA" } }, "載入中…");

  var cats = Object.keys(DEALER_PRODUCTS);
  var catBlocks = cats.map(function (cat) {
    var builtinModels = DEALER_PRODUCTS[cat];
    var customModels = custom[cat] || [];
    var models = builtinModels.concat(customModels);
    var isOpen = openCat === cat;
    var filledCount = models.filter(function (m) { return stock[m] && stock[m] > 0; }).length;
    return h("div", { key: cat, style: { background: "#fff", borderRadius: 12, marginBottom: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" } },
      h("div", {
        onClick: function () { setOpenCat(isOpen ? null : cat); },
        style: { padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", background: isOpen ? "#F8F9FF" : "#fff" }
      },
        h("span", { style: { fontWeight: 700, fontSize: 15, color: "#1A237E" } }, cat + "（" + models.length + "）"),
        h("span", { style: { fontSize: 12, color: "#888" } }, "已填 " + filledCount + " 　" + (isOpen ? "▲" : "▼"))
      ),
      isOpen ? h("div", { style: { borderTop: "1px solid #F0F0F0" } },
        models.map(function (m) {
          var isCustom = customModels.indexOf(m) !== -1;
          return h("div", { key: m, style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 16px", borderBottom: "1px solid #F5F5F5" } },
            h("span", { style: { fontSize: 13, color: "#333", flex: 1, wordBreak: "break-all" } },
              m, isCustom ? h("span", { style: { fontSize: 10, color: "#3949AB", background: "#EEF0FB", borderRadius: 4, padding: "1px 5px", marginLeft: 6 } }, "新增") : null),
            h("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
              h("input", {
                type: "number", min: "0",
                value: stock[m] === undefined ? "" : stock[m],

var CONSIGN_COL = db.collection("consignment");

// 解析寄倉 Excel（多月份分頁）成 JSON
function parseConsignmentWorkbook(wb) {
  var months = [];
  wb.SheetNames.forEach(function (sheetName) {
    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    // 找標題列（含"機型"）
    var headerRow = -1;
    for (var r = 0; r < Math.min(5, rows.length); r++) {
      if (String(rows[r][0]).trim() === "機型") { headerRow = r; break; }
    }
    if (headerRow === -1) return;
    var items = [];
    for (var r2 = headerRow + 1; r2 < rows.length; r2++) {
      var model = String(rows[r2][0] || "").trim();
      if (!model) continue;
      var base = parseInt(rows[r2][1], 10); if (isNaN(base)) base = 0;
      var final = parseInt(rows[r2][13], 10); if (isNaN(final)) final = 0;
      var moves = [];
      for (var c = 2; c < 13; c += 2) {
        var date = rows[r2][c], qty = rows[r2][c + 1];
        if (date !== "" && date != null && qty !== "" && qty != null) {
          var dstr = String(date).split(" ")[0].split("T")[0];
          moves.push({ date: dstr, qty: String(qty) });
        }
      }
      items.push({ model: model, base: base, final: final, moves: moves });
    }
    months.push({ month: sheetName, items: items });
  });
  return months;
}

// ============ 價格表系統 ============
var PRICE_COL = db.collection("priceList");

// 解析價格表 Excel（多分頁，每頁欄位位置不同，用標題比對）
// 各分頁要額外顯示在機型下方的規格欄位（用標題文字比對）
var PRICE_SPEC_FIELDS = {
  "影音商品": ["尺寸(mm)", "備註", "4K / 2K", "面板", "AI", "AirPlay 2", "刷新率", "聲音", "雙杜比", "雙動態", "雙娛樂", "藍芽", "Wifi", "HDMI", "USB", "台製"],
  "冰箱": ["機體尺寸", "能效", "節能", "環保", "MIT", "容量", "顏色"],
  "洗衣機": ["尺寸(mm)", "公斤帶", "含宅安", "智慧", "變頻", "PICO", "超震波", "省水", "節能", "環保", "MIT", "產地"],
  "冷凍櫃": ["尺寸(mm)", "說明", "節能", "容量", "顏色"],
  "除濕機": ["尺寸(mm)", "功能"]
};

function parsePriceWorkbook(wb) {
  var sheets = [];
  wb.SheetNames.forEach(function (sheetName) {
    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    // 找標題列（含"機型"）
    var hr = -1;
    for (var r = 0; r < Math.min(6, rows.length); r++) {
      var rowJoined = rows[r].map(function (x) { return String(x).replace(/\n/g, ""); });
      if (rowJoined.indexOf("機型") !== -1) { hr = r; break; }
    }
    if (hr === -1) return;
    var headerRaw = rows[hr].map(function (x) { return String(x).replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim(); });
    var header = rows[hr].map(function (x) { return String(x).replace(/[\r\n]+/g, ""); });
    function findCol(names) {
      for (var i = 0; i < header.length; i++) {
        for (var n = 0; n < names.length; n++) {
          if (header[i].indexOf(names[n]) !== -1) return i;
        }
      }
      return -1;
    }
    var cModel = findCol(["機型"]);
    var cCat = findCol(["產品別"]);
    var cBase = findCol(["批價"]);
    var cPromo = findCol(["本月特促", "特促"]);
    var cSuggest = findCol(["建議售價", "建議"]);
    var cPrice = -1;
    for (var ip = 0; ip < header.length; ip++) { if (header[ip] === "售價") { cPrice = ip; break; } }

    // 額外規格欄位（用標題文字比對）
    var specDefs = [];
    var wanted = PRICE_SPEC_FIELDS[sheetName];
    if (wanted) {
      wanted.forEach(function (key) {
        for (var ci = 0; ci < header.length; ci++) {
          if (ci === cModel || ci === cCat || ci === cBase || ci === cPromo || ci === cSuggest || ci === cPrice) continue;
          if (header[ci].indexOf(key) !== -1) {
            var dup = specDefs.some(function (s) { return s.col === ci; });
            if (!dup) specDefs.push({ col: ci, label: headerRaw[ci] || key });
            break;
          }
        }
      });
    } else {
      // 沒有預先定義規格欄位的分頁（例如冷氣）：
      // 把除了機型/產品別/批價/特促/建議售價/售價 以外、且有標題文字的欄位都自動當作規格
      // 標題含「價」字的欄位（例如同行價、市價）不顯示在功能規格裡
      for (var ciAuto = 0; ciAuto < header.length; ciAuto++) {
        if (ciAuto === cModel || ciAuto === cCat || ciAuto === cBase || ciAuto === cPromo || ciAuto === cSuggest || ciAuto === cPrice) continue;
        if (!headerRaw[ciAuto]) continue;
        if (headerRaw[ciAuto].indexOf("價") !== -1) continue;
        specDefs.push({ col: ciAuto, label: headerRaw[ciAuto] });
      }
    }

    var items = [];
    var curCat = "";
    for (var r2 = hr + 1; r2 < rows.length; r2++) {
      var row = rows[r2];
      var model = String(row[cModel] || "").replace(/\n/g, " ").trim();
      if (!model) continue;
      var cat = cCat >= 0 ? String(row[cCat] || "").replace(/\n/g, "").trim() : "";
      if (cat) curCat = cat;
      function val(ci) { return ci >= 0 ? String(row[ci] || "").replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim() : ""; }
      var specs = [];
      specDefs.forEach(function (sd) {
        var v = String(row[sd.col] || "").replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim();
        if (v) specs.push({ label: sd.label, value: v });
      });
      items.push({
        model: model,
        cat: curCat,
        base: val(cBase),
        promo: val(cPromo),
        suggest: val(cSuggest),
        price: val(cPrice),
        specs: specs
      });
    }
    if (items.length > 0) sheets.push({ name: sheetName, items: items });
  });
  return sheets;
}

// ── 舊款型號保留（只留功能規格）──────────────────────────────
// 價格表上傳後，如果某個型號不在新表裡（機型轉換、除役），
// 只把它的「功能規格」存到 priceList/current 的 retired 陣列，
// 批價、特促等其他資料一律不保留。保留 6 個月，之後自動清掉。
// 舊款不在 sheets 裡，所以不會出現在價格表畫面、功能列表或 AI 參考資料；
// 只有 LINE 機器人的「查XXX功能」「查XXX價錢」會用到它。
var RETIRED_KEEP_MS = 180 * 24 * 60 * 60 * 1000;

// 型號比對用的 key：跟機器人一樣，去掉看不見的字元、換行變空格、轉大寫，取第一段（主型號）
function priceModelKey(raw) {
  return String(raw)
    .replace(/[\u200b-\u200d\ufeff]/g, "")
    .replace(/[\r\n\t\u3000\u00a0]/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase()
    .split(" ")[0];
}

// 把 "AU/AM-HF28D" 拆成 ["AU-HF28D", "AM-HF28D"]（跟機器人同一套規則）
function expandSlashKey(q) {
  var slashIdx = q.indexOf("/");
  if (slashIdx === -1) return [q];
  var afterSlash = q.slice(slashIdx + 1);
  var dashIdx = afterSlash.indexOf("-");
  if (dashIdx === -1) {
    return q.split("/").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  var suffix = afterSlash.slice(dashIdx);
  return [q.slice(0, slashIdx) + suffix, afterSlash.slice(0, dashIdx) + suffix];
}

// oldData：資料庫裡目前的價格表文件；finalSheets：這次上傳後最終會存進去的 sheets
// 回傳新的 retired 陣列
function buildRetiredList(oldData, finalSheets) {
  var now = Date.now();
  var presentKeys = {};
  (finalSheets || []).forEach(function (sh) {
    (sh.items || []).forEach(function (it) {
      var k = priceModelKey(it.model);
      presentKeys[k] = true;
      expandSlashKey(k).forEach(function (e) { presentKeys[e] = true; });
    });
  });
  function isPresent(k) {
    if (presentKeys[k]) return true;
    return expandSlashKey(k).some(function (e) { return presentKeys[e]; });
  }

  var result = [];
  var seen = {};

  // 1) 這次新被拿掉的型號：只保留功能規格（沒有規格的就沒東西可留）
  ((oldData && oldData.sheets) || []).forEach(function (sh) {
    (sh.items || []).forEach(function (it) {
      var k = priceModelKey(it.model);
      if (!k || seen[k] || isPresent(k)) return;
      if (!it.specs || it.specs.length === 0) return;
      seen[k] = true;
      result.push({ model: it.model, sheet: sh.name, cat: it.cat || "", specs: it.specs, retiredAt: now });
    });
  });

  // 2) 先前就已經是舊款的：沒有重新出現在價格表、也還沒超過 6 個月，就繼續留著
  ((oldData && oldData.retired) || []).forEach(function (r) {
    var k = priceModelKey(r.model);
    if (!k || seen[k] || isPresent(k)) return;
    if (now - (r.retiredAt || now) > RETIRED_KEEP_MS) return;
    seen[k] = true;
    result.push(r);
  });

  return result;
}

function apiSha256Hex(text) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ("0" + b.toString(16)).slice(-2);
    }).join("");
  });
}
function apiGenToken() {
  var bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  var s = btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return "sk_" + s;
}
function apiToggleCode(arr, code) {
  return arr.indexOf(code) === -1 ? arr.concat([code]) : arr.filter(function (c) { return c !== code; });
}
function apiLocChips(selected, onToggle) {

}

      setMsg("檔案過大，請控制在 8MB 以內");
      e.target.value = "";
      return;
    }
    setFile(f || null);
    setMsg("");
  }

  function fileToBase64(f) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result;
        var base64 = result.split(",")[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(f);
    });
  }

  function send() {
    var trimmed = text.trim();
    if (!trimmed && !file) { setMsg("請輸入公告文字或選擇要傳送的檔案/照片"); return; }
    setBusy(true); setMsg("");

    auth.currentUser.getIdToken().then(function (idToken) {
      if (!file) {
        return fetch(ANNOUNCEMENT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
          body: JSON.stringify({ text: trimmed, fileUrl: "", fileType: "" })
        }).then(function (res) { return res.json(); });
      }

      return fileToBase64(file).then(function (base64) {
        return fetch(UPLOAD_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
          body: JSON.stringify({ fileName: file.name, contentType: file.type || "application/octet-stream", dataBase64: base64 })
        });
      }).then(function (res) { return res.json(); }).then(function (uploadData) {
        if (!uploadData || !uploadData.ok) {
          throw new Error(uploadData && uploadData.error ? uploadData.error : "檔案上傳失敗");
        }
        var isImage = file.type && file.type.indexOf("image/") === 0;
        return auth.currentUser.getIdToken().then(function (idToken2) {
          return fetch(ANNOUNCEMENT_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken2 },
            body: JSON.stringify({ text: trimmed, fileUrl: uploadData.url, fileType: isImage ? "image" : "file" })
          });
        }).then(function (res) { return res.json(); });
      });
    }).then(function (data) {
      setBusy(false);
      if (data && data.ok) {
        setMsg("✅ 已發送給 " + data.success + " / " + data.total + " 個群組");
        setText(""); setFile(null);
      } else {
        setMsg("❌ 發送失敗：" + (data && data.error ? data.error : "未知錯誤"));
      }
    }).catch(function (err) {
      console.error(err);
      setBusy(false);
      setMsg("❌ " + (err && err.message ? err.message : "發送失敗，請稍後再試"));
    });
  }

  return h("div", { style: { background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 1px 6px rgba(0,0,0,0.07)" } },
    h("div", { style: { fontWeight: 800, fontSize: 16, color: "#1A237E", marginBottom: 4 } }, "📢 發送公告到所有群組"),
    h("div", { style: { fontSize: 12, color: "#888", marginBottom: 14, lineHeight: 1.6 } },
      "公告會由「庫存小幫手」發送到白名單裡的每一個 LINE 群組。可以只打文字、只傳照片/檔案，或兩者一起送。單檔限制 8MB。"
    ),
    h("textarea", {
      value: text, onChange: function (e) { setText(e.target.value); },
      placeholder: "輸入公告內容…",
      rows: 4,
      style: { width: "100%", boxSizing: "border-box", padding: "10px 12px", marginBottom: 10, borderRadius: 8, border: "1.5px solid #E0E0E0", fontSize: 14, outline: "none", fontFamily: "inherit", resize: "vertical" }
    }),
    file ? h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: "#F8F9FF", borderRadius: 8, marginBottom: 10, fontSize: 13 } },
      h("span", { style: { color: "#1A237E", wordBreak: "break-all" } }, "📎 " + file.name),
      h("button", { onClick: function () { setFile(null); }, style: { fontSize: 12, color: "#C62828", border: "none", background: "none", cursor: "pointer", flexShrink: 0, marginLeft: 8 } }, "✕")
    ) : h("button", {
      onClick: function () { if (fileRef.current) fileRef.current.click(); },
      style: { width: "100%", padding: "12px", borderRadius: 10, border: "2px dashed #3949AB", background: "#EEF0FB", color: "#3949AB", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", marginBottom: 10 }
    }, "📎 選擇照片或檔案（選填）"),

// 寄倉表網頁編輯器（管理者/區域主管可用）
function ConsignmentEditor(props) {
  var code = props.code;
  var dealerName = props.dealerName || "";
  var monthsState = useState(null);
  var months = monthsState[0], setMonths = monthsState[1];
  var consignCodeState = useState("");
  var consignCode = consignCodeState[0], setConsignCode = consignCodeState[1];
  var loadingState = useState(true);
  var loading = loadingState[0], setLoading = loadingState[1];
  var savingState = useState(false);
  var saving = savingState[0], setSaving = savingState[1];
  var msgState = useState("");
  var msg = msgState[0], setMsg = msgState[1];
  var openMonthState = useState(null);
  var openMonth = openMonthState[0], setOpenMonth = openMonthState[1];

  useEffect(function () {
    CONSIGN_COL.doc(code).get().then(function (doc) {
      var data = doc.exists ? doc.data() : {};
      var m = data.months ? data.months : [];
      setMonths(m);
      setConsignCode(data.consignCode || "");
      if (m.length > 0) setOpenMonth(m[m.length - 1].month);
      setLoading(false);
    }).catch(function () { setMonths([]); setLoading(false); });
  }, [code]);

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function addMonth() {
    var name = prompt("輸入月份（格式 YYYY-MM，例如 2026-07）");
    if (!name) return;
    name = name.trim();
    if (months.some(function (m) { return m.month === name; })) { alert("該月份已存在"); return; }
    var next = clone(months);
    next.push({ month: name, items: [] });
    next.sort(function (a, b) { return a.month.localeCompare(b.month); });
    setMonths(next);
    setOpenMonth(name);
  }

  function delMonth(monthName) {
    if (!confirm("確定刪除 " + monthName + " 整個月份？")) return;
    setMonths(months.filter(function (m) { return m.month !== monthName; }));
  }

  function addModel(monthName) {
    var model = prompt("輸入機型名稱");
    if (!model) return;
    model = model.trim();
    var next = clone(months);
    var mObj = next.find(function (m) { return m.month === monthName; });
    if (mObj.items.some(function (it) { return it.model === model; })) { alert("該機型已存在"); return; }
    mObj.items.push({ model: model, base: 0, final: 0, moves: [] });
    setMonths(next);
  }

  function delModel(monthName, model) {
    var next = clone(months);
    var mObj = next.find(function (m) { return m.month === monthName; });
    mObj.items = mObj.items.filter(function (it) { return it.model !== model; });
    setMonths(next);
  }

  function recalcFinal(it) {
    var inSum = 0, outSum = 0;
    it.moves.forEach(function (mv) {
      var q = parseInt(mv.qty, 10) || 0;
      if (mv.type === "out") outSum += q; else inSum += q;
    });
    it.final = (parseInt(it.base, 10) || 0) + inSum - outSum;
  }

  function updateField(monthName, model, field, val) {
    var next = clone(months);
    var mObj = next.find(function (m) { return m.month === monthName; });
    var it = mObj.items.find(function (x) { return x.model === model; });
    if (field === "base") {
      it.base = val === "" ? 0 : (parseInt(val, 10) || 0);
      it.finalManual = false;
      recalcFinal(it);
    } else if (field === "final") {
      it.final = val === "" ? 0 : (parseInt(val, 10) || 0);
      it.finalManual = true;  // 手動覆蓋
    }
    setMonths(next);
  }

  function addMove(monthName, model) {
    var next = clone(months);
    var mObj = next.find(function (m) { return m.month === monthName; });
    var it = mObj.items.find(function (x) { return x.model === model; });
    it.moves.push({ date: "", qty: "", type: "in", who: "" });
    setMonths(next);
  }

  function updateMove(monthName, model, idx, field, val) {
    var next = clone(months);
    var mObj = next.find(function (m) { return m.month === monthName; });
    var it = mObj.items.find(function (x) { return x.model === model; });
    it.moves[idx][field] = val;
    it.finalManual = false;
    recalcFinal(it);
    setMonths(next);
  }

  function delMove(monthName, model, idx) {
    var next = clone(months);
    var mObj = next.find(function (m) { return m.month === monthName; });
    var it = mObj.items.find(function (x) { return x.model === model; });
    it.moves.splice(idx, 1);
    it.finalManual = false;
    recalcFinal(it);
    setMonths(next);

// 寄倉表系統容器（登入後檢視寄倉表）

        }, editMode ? "完成編輯" : "✏️ 編輯")
      ),

        ? h(ConsignmentEditor, { code: selected.code, dealerName: selected.name })
        : h(ConsignmentView, { code: selected.code })
    );
  }

  // 已建立寄倉、且在此身分可見範圍內的經銷商

      h("div", null,

      ),
      h("button", { onClick: logout, style: { padding: "6px 14px", borderRadius: 8, border: "1.5px solid #E0E0E0", background: "#fff", color: "#C62828", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit" } }, "登出")
    ),

    // 搜尋建立區

      h("div", { style: { fontSize: 13, fontWeight: 700, color: "#1A237E", marginBottom: 8 } }, "🔍 搜尋經銷商建立寄倉表"),
      h("input", {
        value: searchInput, onChange: function (e) { setSearchInput(e.target.value); },
        placeholder: "輸入經銷商代號或店名…",
        style: { width: "100%", boxSizing: "border-box", padding: "11px 12px", borderRadius: 10, border: "1.5px solid #E0E0E0", fontSize: 14, outline: "none", fontFamily: "inherit" }
      }),
      searchMatches.length > 0 ? h("div", { style: { border: "1px solid #E0E0E0", borderRadius: 8, marginTop: 8, overflow: "hidden" } },
        searchMatches.map(function (d) {
          var has = existing && existing[d.code];
          return h("div", { key: d.code, onClick: function () { setSelected(d); setEditMode(true); },
            style: { padding: "10px 12px", borderBottom: "1px solid #F0F0F0", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 } },
            h("span", { style: { fontWeight: 600 } }, d.code + " " + d.name),
            h("span", { style: { fontSize: 11, color: has ? "#2E7D32" : "#3949AB" } }, has ? "已建立·編輯" : "＋ 建立")
          );

    ),

    // 已建立列表
    h("div", { style: { fontSize: 13, fontWeight: 700, color: "#666", padding: "4px 4px 8px" } }, "已建立寄倉表（" + existingDealers.length + " 家）"),
    existing === null
      ? h("div", { style: { textAlign: "center", padding: "20px", color: "#AAA", fontSize: 13 } }, "載入中…")
      : existingDealers.length === 0
        ? h("div", { style: { textAlign: "center", padding: "30px 20px", background: "#fff", borderRadius: 12, color: "#AAA", fontSize: 13 } }, "尚無已建立的寄倉表，請用上方搜尋建立")

                h("div", { style: { minWidth: 0, flex: 1 } },

                    d.code + " " + d.name + (info.consignCode ? "（" + info.consignCode + "）" : "")),
                  h("div", { style: { fontSize: 11, color: "#888", marginTop: 1 } }, info.updatedAt || "")
                ),
                h("span", { style: { fontSize: 16, color: "#CCC", marginLeft: 8 } }, "›")
              );
            })
          )
  );
}



// ============ LINE 群組白名單管理 ============
var GROUP_WHITELIST_COL = db.collection("allowedGroups");

function GroupWhitelistManager(props) {
  var listState = useState(null);
  var list = listState[0], setList = listState[1];
  var nameState = useState("");
  var name = nameState[0], setName = nameState[1];
  var idState = useState("");
  var gid = idState[0], setGid = idState[1];
  var msgState = useState("");
  var msg = msgState[0], setMsg = msgState[1];
  var busyState = useState(false);
  var busy = busyState[0], setBusy = busyState[1];
  // 每個群組「待套用」的儲位選擇（尚未按確定前不寫入資料庫）
  var pendingLocState = useState({});
  var pendingLoc = pendingLocState[0], setPendingLoc = pendingLocState[1];
  var locMsgState = useState({});
  var locMsg = locMsgState[0], setLocMsg = locMsgState[1];

  var FEATURES = [
    { key: "stock", label: "庫存查詢", hint: "查型號" },
    { key: "feature", label: "功能查詢", hint: "查型號功能" },
    { key: "price", label: "價錢查詢", hint: "查型號價錢" },
    { key: "list", label: "列表查詢", hint: "列表關鍵字" }
  ];

  function load() {
    GROUP_WHITELIST_COL.get().then(function (snap) {
      var arr = [];
      snap.forEach(function (doc) { arr.push(Object.assign({ id: doc.id }, doc.data())); });
      arr.sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
      setList(arr);
    }).catch(function () { setList([]); });
  }

  useEffect(function () { load(); }, []);

  function addGroup() {
    var idClean = gid.trim();
    var nameClean = name.trim();
    if (!idClean || !nameClean) { setMsg("請輸入群組名稱和群組 ID"); return; }
    setBusy(true); setMsg("");
    var now = new Date().toLocaleString("zh-TW", { hour12: false });
    GROUP_WHITELIST_COL.doc(idClean).set({
      name: nameClean, groupId: idClean, addedAt: now,
      location: DEFAULT_LOCATION,
      permissions: { stock: true, feature: true, price: true, list: true }
    }).then(function () {
      setBusy(false);
      setMsg("✅ 已新增「" + nameClean + "」，四項功能預設全開");
      setName(""); setGid("");
      load();
    }).catch(function () { setBusy(false); setMsg("❌ 新增失敗，請確認 Firestore 規則已加 allowedGroups"); });
  }

  function togglePermission(g, key) {
    var current = g.permissions || {};
    var next = {
      stock: current.stock !== false,
      feature: current.feature !== false,
      price: current.price !== false,
      list: current.list !== false
    };
    next[key] = !next[key];
    GROUP_WHITELIST_COL.doc(g.id).set({ permissions: next }, { merge: true }).then(function () {
      load();
    }).catch(function () {
      setMsg("❌ 權限更新失敗");
    });
  }

  function pickLocation(g, code) {
    var next = Object.assign({}, pendingLoc);
    next[g.id] = code;
    setPendingLoc(next);
    var m = Object.assign({}, locMsg);
    delete m[g.id];
    setLocMsg(m);
  }

  function applyLocation(g) {
    var code = pendingLoc[g.id];
    if (!code || code === (g.location || DEFAULT_LOCATION)) return;
    GROUP_WHITELIST_COL.doc(g.id).set({ location: code }, { merge: true }).then(function () {
      var m = Object.assign({}, locMsg);
      m[g.id] = "✅ 已套用";
      setLocMsg(m);
      var next = Object.assign({}, pendingLoc);
      delete next[g.id];
      setPendingLoc(next);
      load();
    }).catch(function () {
      var m = Object.assign({}, locMsg);
      m[g.id] = "❌ 更新失敗";
      setLocMsg(m);
    });
  }

  function removeGroup(id) {
    if (!confirm("確定移除這個群組嗎？移除後機器人會立刻退出該 LINE 群組，查詢功能全部停用。")) return;
    setMsg("處理中…");
    GROUP_WHITELIST_COL.doc(id).delete().then(function () {
      load();
      if (!auth.currentUser) {
        setMsg("❌ 登入狀態已失效，請重新整理頁面並重新登入後再試一次");
        return;
      }
      return auth.currentUser.getIdToken().then(function (idToken) {
        return fetch(LEAVE_GROUP_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
          body: JSON.stringify({ groupId: id })
        });
      }).then(function (res) { return res.json(); }).then(function (data) {
        setMsg(data && data.ok ? "✅ 已移除，機器人已退出該群組" : "⚠️ 已移除白名單，但機器人退出失敗（可能已不在群組內）");
      }).catch(function () {
        setMsg("⚠️ 已移除白名單，但機器人退出失敗（可能已不在群組內）");
      });
    }).catch(function () {
      setMsg("❌ 移除失敗");
    });
  }

  return h("div", { style: { background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 1px 6px rgba(0,0,0,0.07)" } },
    h("div", { style: { fontWeight: 800, fontSize: 16, color: "#1A237E", marginBottom: 4 } }, "🔐 LINE 群組白名單與權限"),
    h("div", { style: { fontSize: 12, color: "#888", marginBottom: 10, lineHeight: 1.6 } },
      "只有加入白名單的群組才能使用機器人。每個群組可個別指定要查詢哪一個儲位（選好後要按「確定套用」才生效），並開關四項查詢功能。取得群組 ID：把機器人拉進群組後，在群組裡打「groupid」。機器人加入群組後 2 分鐘內若未完成白名單設定，會自動退出；按「移除」會讓機器人立刻退出該群組。"
    ),
    (function () {
      var codes = Object.keys(props.locations || {});

  function expandSearchTerms(raw) {
    var q = raw.trim().toLowerCase();
    if (!q) return [];
    var slashIdx = q.indexOf("/");
    if (slashIdx === -1) return [q];

    // 嘗試找出 "/" 之後、下一個"-"之前的共同後段
    // 例如 "au/am-hf28d" -> prefixes: ["au","am"], suffix: "hf28d"
    var afterSlash = q.slice(slashIdx + 1);
    var dashIdx = afterSlash.indexOf("-");
    if (dashIdx === -1) {
      // 沒有共同後段，單純把每個用 / 分隔的詞都當作關鍵字
      return q.split("/").map(function (s) { return s.trim(); }).filter(Boolean);
    }
    var firstPrefix = q.slice(0, slashIdx);
    var secondPrefix = afterSlash.slice(0, dashIdx);

      );
    });

    var statBoxes = [
      { label: "總品項數", value: stats.total },
      { label: "總庫存台數", value: stats.totalUnits },
      { label: "庫存不足", value: stats.lowStock },
      { label: "完全無庫存", value: stats.outOfStock }
    ].map(function (s) {
      return h("div", { key: s.label, style: { background: "#F8F9FF", borderRadius: 8, padding: "10px 12px" } },
        h("div", { style: { fontSize: 11, color: "#888" } }, s.label),
        h("div", { style: { fontSize: 20, fontWeight: 800, color: "#1A237E", marginTop: 2 } }, s.value)
      );
    });

    manageContent = h("div", { style: { display: "flex", flexDirection: "column", gap: 14 } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff", borderRadius: 14, padding: "12px 16px", boxShadow: "0 1px 6px rgba(0,0,0,0.07)" } },
        h("div", { style: { fontSize: 12, color: "#666" } }, "👤 已登入：" + currentUser.email),
        h("button", {
          onClick: handleLogout,
          style: {
            padding: "6px 14px", borderRadius: 8, border: "1.5px solid #E0E0E0",
            background: "#fff", color: "#C62828", fontWeight: 700, fontSize: 12,
            cursor: "pointer", fontFamily: "inherit"
          }
        }, "登出")
      ),
      h("div", { style: { background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 1px 6px rgba(0,0,0,0.07)" } },
        h("div", { style: { fontWeight: 800, fontSize: 16, color: "#1A237E", marginBottom: 4 } }, "📤 上傳 SAP 庫存表"),
        h("div", { style: { fontSize: 12, color: "#888", marginBottom: 16, lineHeight: 1.6 } },
          "直接上傳 SAP 匯出的庫存表（.xlsx/.xlsm）。系統會從「庫存原始檔」工作表中，同時抓取 " + TARGET_LOCATIONS.map(function (l) { return l.code; }).join("、") + " 三個儲位的資料分開存放，各群組可在下方白名單設定要查詢哪一個儲位。未出現在本次 SAP 匯出但屬於經銷商型號清單的品項，會自動補上庫存 0。"
        ),
        h("button", {
          onClick: function () { if (fileRef.current) fileRef.current.click(); },
          disabled: isUploading,
          style: {
            width: "100%", padding: "14px", borderRadius: 10, border: "2px dashed #3949AB",
            background: isUploading ? "#F5F5F5" : "#EEF0FB", color: "#3949AB", fontWeight: 700, fontSize: 14,
            cursor: isUploading ? "not-allowed" : "pointer", fontFamily: "inherit",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 8
          }
        }, isUploading ? "⏳ 解析並上傳中…" : "📁 每日上傳庫存表"),
        h("input", { ref: fileRef, type: "file", accept: ".xlsx,.xls,.xlsm", onChange: handleFileUpload, style: { display: "none" } }),
        uploadMsg ? h("div", {
          style: {
            marginTop: 12, padding: "10px 14px", borderRadius: 8,
            background: uploadMsg.indexOf("✅") === 0 ? "#E8F5E9" : "#FFEBEE",
            color: uploadMsg.indexOf("✅") === 0 ? "#2E7D32" : "#C62828",
            fontSize: 13, fontWeight: 600, lineHeight: 1.5
          }
        }, uploadMsg) : null
      ),
      h(PriceListUpload),
      h(ACPriceUpload),
      h(ConsignmentUpload),
      h(GroupWhitelistManager, { locations: locationsData }),
      h(NotifySettingsManager),
      h(ApiKeysManager),
      h(AnnouncementManager),
      h(AdjustPanel, { data: data, locations: locationsData, onApply: handleAdjust }),
      h(AdjustedList, { data: data, locations: locationsData, onApply: handleAdjust }),
      h("div", { style: { background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 1px 6px rgba(0,0,0,0.07)" } },
        h("div", { style: { fontWeight: 700, fontSize: 14, color: "#333", marginBottom: 12 } }, "📋 自動分類規則"),
        h("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, ruleRows),
        h("div", { style: { marginTop: 14, padding: "10px 12px", background: "#F8F9FF", borderRadius: 8, fontSize: 11, color: "#666", lineHeight: 1.6 } },
          "目前抓取儲位：" + TARGET_LOCATIONS.map(function (l) { return l.code + "(" + l.label + ")"; }).join("、") + "。不符合上述分類前綴的型號將歸類為小家電。"
        )
      ),
      h("div", { style: { background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 1px 6px rgba(0,0,0,0.07)" } },
        h("div", { style: { fontWeight: 700, fontSize: 14, color: "#333", marginBottom: 12 } }, "📊 目前資料狀態"),
        h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 } }, statBoxes),
        lastUpdated ? h("div", { style: { marginTop: 10, fontSize: 11, color: "#AAAAAA" } }, "最後更新時間：" + lastUpdated) : null
      )
    );
  }

  // ── 經銷商分頁內容 ──
  var dealerContent = null;
  if (tab === "經銷商") {
    dealerContent = h(DealerSystem);
  }

  // ── 寄倉表分頁內容 ──
  var consignContent = null;
  if (tab === "寄倉") {
    consignContent = h(ConsignmentSystem);
  }

  // ── 價格表分頁內容 ──
  var priceContent = null;
  if (tab === "價格") {
    priceContent = h(PriceListSystem);
  }

  var bodyContent;
  if (tab === "價格") bodyContent = priceContent;
  else if (tab === "寄倉") bodyContent = consignContent;
  else if (tab === "經銷商") bodyContent = dealerContent;
  else if (tab === "管理") bodyContent = manageContent;
  else bodyContent = queryContent;

  var needLoading = (tab === "管理") && loading;

  return h("div", { className: "app-container", style: { minHeight: "100vh", background: "#F2F4F8" } },
    header,
    h("div", { style: { padding: "16px 16px 40px" } },
      needLoading ? h("div", { style: { textAlign: "center", padding: "60px 20px", color: "#AAAAAA" } }, "載入中…") : bodyContent
    )
  );
}

try {
  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(h(InventoryApp));
} catch (e) {
  var box = document.getElementById("error-box");
  box.style.display = "block";
  box.textContent = "渲染時發生錯誤：\n" + e.message + "\n" + (e.stack || "");
}
</script>
</body>
</html>
