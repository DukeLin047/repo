  body {

    border: 1px solid var(--border);
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
    margin-bottom: 8px;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary { background: var(--accent-gold); }
  button.danger { background: var(--danger); }
  button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .row { display: flex; gap: 8px; align-items: center; }
  .shop-title { font-weight: 600; font-size: 16px; color: var(--text); }
  .menu-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .menu-item:last-child { border-bottom: none; }
  .muted { color: var(--text-light); font-size: 13px; }
